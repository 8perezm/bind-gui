name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      # ── Version Bump (only on branch pushes, not tag triggers) ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine and bump version
        id: bump
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        working-directory: ./bind-gui
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json with new version
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            
            if (pkg.version !== '${{ steps.bump.outputs.new_version }}') {
              pkg.version = '${{ steps.bump.outputs.new_version }}';
              fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + '\n');
              console.log(`Updated package.json to v${pkg.version}`);
            } else {
              console.log('Version unchanged, skipping commit.');
              core.setOutput('skip_commit', true);
            }

      - name: Commit and push version bump
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git add bind-gui/package.json
          
          # Handle potential conflicts from concurrent pushes
          git pull --rebase origin main || echo "No remote changes to rebase"
          
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}" || echo "No changes to commit"
          git push origin main || echo "Push may have failed — checking status..."
          
          # If push fails due to already-updated remote, pull and retry once
          if [ $? -ne 0 ]; then
            echo "Retrying with pull-rebase..."
            git pull --rebase origin main
            git push origin main
          fi

      - name: Create and push git tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi

      # ── Docker Build & Push ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bind-dns-gui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,prefix=,format=short
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./bind-gui
          file: ./bind-gui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
