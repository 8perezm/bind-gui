services:
  bind-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bind9-gui
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - CONFIG_DIR=/app/bind/config
      - BIND_RNDC_HOST=bind9
      - BIND_DNS_HOST=bind9
      - TSIG_KEY_FILE=/etc/bind/bind-gui.key
      - RNDC_CONFIG=/etc/rndc.conf
    volumes:
      - ../bind/config:/app/bind/config:rw
      - ../bind/config/bind-gui.key:/etc/bind/bind-gui.key:ro
      - ./rndc.conf:/etc/rndc.conf:ro
      # Mount the Docker socket (optional — no longer required for zone writes)
      - /var/run/docker.sock:/var/run/docker.sock:ro
