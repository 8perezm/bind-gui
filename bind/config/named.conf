// ── Bind DNS GUI — Sample Configuration ──────────────────────────────
// This is a starting point for your BIND9 DNS server.
// Customise it for your network and domain, then reload BIND.

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";

// ── RNDC Controls ───────────────────────────────────────────────────
// Enable remote administration via rndc over the internal Docker
// network. Authenticated with the bind-gui-key (HMAC-SHA256) shared
// between the bind9 and bind-gui containers.
controls {
    inet 0.0.0.0 port 953 allow { 172.16.0.0/12; 10.0.0.0/8; 192.168.0.0/16; } keys { "bind-gui-key"; };
};

// TSIG key shared between bind9 and bind-gui for nsupdate + rndc auth.
// Generate with:  docker compose run --rm bind9 tsig-keygen -a hmac-sha256 bind-gui-key
include "/etc/bind/bind-gui.key";

// Catalog zones (RFC 9432) — uncomment in Phase 2
//include "/etc/bind/named.conf.catalog";